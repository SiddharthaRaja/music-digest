# =====================================================================
#  MUSIC DIGEST SETTINGS
#  Change this file to change what your digest covers.
#  Lines starting with # are notes and are ignored. Indentation (the
#  spaces at the start of lines) matters: copy the pattern around you.
# =====================================================================

digest_name: Music Digest
timezone: Asia/Kolkata            # times in the emails use this time zone


# ---------------------------------------------------------------------
# 1. EMAILS
# ---------------------------------------------------------------------
email:
  separate_charts_email: true     # true = two emails: "News" and "Charts & Stats"
  attach_full_digest: true        # attach a web page with EVERY story found (the email shows the best of each section)
  max_email_kb: 95                # Gmail trims emails over ~100 KB, so long lists get shortened to fit


# ---------------------------------------------------------------------
# 2. ARTISTS
#    Headlines naming these artists get their own sections.
#    - pinned:     always at the very top (artists you're studying closely)
#    - superstars: the "Superstars" section, grouped by artist
#    - rising:     a starter list; the charts also spot new breakouts by themselves
#    A name starting with = is matched exactly, capitals and all
#    (for names that are also everyday words, like =TWICE).
#    Left out on purpose because they're common words: Future, Dave, Lisa, V.
# ---------------------------------------------------------------------
artists:
  pinned: []

  superstars:
