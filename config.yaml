# How a song counts as a "breakout" (artists not in your superstar list):
breakouts:
  new_entry_top: 100        # a new entry anywhere in a chart's top 100
  jump_at_least: 15         # or a jump of at least this many places
  shazam_top: 25            # or any spot in a Shazam top 25 (people looking it up = early buzz)


# ---------------------------------------------------------------------
# 10. OPTIONAL AI SUMMARY
#     Add an Anthropic API key (ANTHROPIC_API_KEY) to get "Today in 60
#     seconds", a one-line read on each big section, and a takeaway for
#     your own rollout at the top of the News email.
# ---------------------------------------------------------------------
ai:
  enabled: auto                     # auto = on only when the key is set; false = always off
  model: claude-haiku-4-5-20251001  # the cheapest, fastest Claude model
  max_headlines: 160


# ---------------------------------------------------------------------
# 11. FINE-TUNING
# ---------------------------------------------------------------------
settings:
  biggest_story_min_outlets: 3  # covered by this many outlets = "Biggest stories"
  first_run_hours: 24           # how far back the very first digest looks
  overlap_hours: 2              # re-check this much before the last digest, for late-posted stories
  stale_feed_days: 7            # warn when a feed hasn't posted for this many days
  calendar_days_ahead: 45       # how far ahead the release calendar looks
  # Outlets that get a ranking boost when choosing which stories to show in full.
  top_outlets: [Billboard, Rolling Stone, Variety, Pitchfork, NME, The Guardian, BBC, Complex, XXL, Stereogum,
                Consequence, Uproxx, The Fader, Hits Daily Double, Music Business Worldwide, MusicWeek, Music Week,
                The New York Times, Associated Press, AP News, Reuters, The Hollywood Reporter, Vulture, NPR,
                People, Entertainment Weekly, Spin, Dork, The Line of Best Fit, Resident Advisor, DJ Mag, Mixmag,
                The Quietus, clashmusic.com, DIY Magazine, Bandcamp Daily, Soompi, Remezcla, Saving Country Music]
  user_agent: "MusicDigest/2.0 (personal music news digest; RSS reader)"
