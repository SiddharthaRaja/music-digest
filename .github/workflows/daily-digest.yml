name: Daily music digest

on:
  schedule:
    # Times here are UTC. 00:20 UTC = 5:50 AM India time, so the email lands
    # around 6 AM (GitHub sometimes starts scheduled runs a few minutes late).
    # For around 12 PM India time instead, use: "20 6 * * *"
    - cron: "20 0 * * *"
  workflow_dispatch:          # adds a "Run workflow" button (works from the GitHub phone app too)
    inputs:
      hours:
        description: "Look back this many hours (leave empty for: everything new since the last digest)"
        required: false
        default: ""

permissions:
  contents: write             # lets the run save its memory of what you've already seen

concurrency:
  group: music-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Build and email the digests
        env:
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LOOKBACK_HOURS: ${{ github.event.inputs.hours }}
        run: |
          if [[ "$LOOKBACK_HOURS" =~ ^[0-9]+$ ]]; then
            python digest.py --no-open --hours "$LOOKBACK_HOURS"
          else
            python digest.py --no-open
          fi

      - name: Remember what was sent (so tomorrow has no repeats)
        run: |
          git config user.name "music-digest-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/seen.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update digest memory"
          git pull --rebase --autostash
          git push

      - name: Keep a copy of the digest (Actions tab > this run > Artifacts)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: digest
          path: output/*.html
          retention-days: 14
          if-no-files-found: ignore
